# 自动瞄准总配置：各模块读自己那一段

# ---- 相机 ----
exposure_ms: 5.0
gain: 16.0
transport_ms: 0.0

# ---- 检测 ----
enemy_color: "blue"         # red 或 blue
color_threshold: 120        # 敌方通道减去对方通道的阈值
brightness_threshold: 80    # 灰度阈值
morph_size: 1               # 闭运算核边长，像素，1 表示不处理
min_lightbar_ratio: 1.5     # 灯条高/宽 下限
min_lightbar_area: 50       # 灯条面积下限，像素²
min_height_ratio: 0.7       # 两灯条高度 短/长 下限
max_tilt_diff_deg: 10.0     # 两灯条倾角差 上限，度
max_center_offset: 1.0      # 中心上下偏移/灯条高 上限
min_armor_ratio: 0.5        # 两灯条间距/灯条高 下限
max_armor_ratio: 4.0        # 两灯条间距/灯条高 上限

# ---- 解算 ----
# 内参来自 camera_calib，17 张，平均重投影误差 0.157 px
camera_matrix: [1807.43119, 0, 705.707538, 0, 1806.22264, 541.329513, 0, 0, 1]
distort_coeffs: [-0.0756689153, 0.1281247, 5.57990328e-05, -2.47610297e-05, 0]
# 装甲板：灯条长边、两灯条中心线间距，mm
lightbar_length: 55
lightbar_gap: 130
# 手眼：相机相对炮管的安装角，度；正为偏右 / 偏下 / 图像顺时针
handeye_yaw_deg: 0.0
handeye_pitch_deg: 0.0
handeye_roll_deg: 0.0
# 光心相对云台原点，mm，x 右 y 下 z 前（相机在炮管左边，故 x 取负）
# 该向量随俯仰转动，因为相机装在俯仰臂上
handeye_offset_mm: [-54.12, 8.00, 157.00]

# ---- 跟踪 ----
armor_radius: 250.0         # 装甲板到旋转中心的水平距离，mm，板子尺寸固定所以写死
armor_count: 4              # 装甲板数量，相邻两块间隔 360/armor_count 度
track_process_noise: 100.0  # 圆心过程噪声谱密度，越大越信观测、越跟得上机动
track_measure_noise: 0.01   # 位置观测噪声方差，m²（0.01 约等于 10cm 标准差）
track_yaw_noise: 0.01       # 板面角度观测噪声方差，rad²（0.01 约等于 5.7°）
track_rotation_noise: 1.0   # 角速度谱密度，越大越跟得上急转
track_max_lost: 20          # 连续丢失多少帧后放弃，165fps 下约 120ms

# ---- 瞄准 ----
# 丢失目标后原位停留 lost_hold_ms，再按 return_deg_per_s 缓慢归零
lost_hold_ms: 3000.0
return_deg_per_s: 30.0

# ---- 云台 ----
bullet_speed: 23.0 # 弹速，m/s，回传优先，断线时用这个兜底
gravity: 9.8 # 重力加速度，m/s²，解算下坠量用
com_port: "" # 留空则不接串口，姿态固定为 0，纯离线调试
baud_rate: 115200
